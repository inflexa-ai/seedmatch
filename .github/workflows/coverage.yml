name: Coverage

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install the dependencies
        run: uv sync --locked

      # Coverage cannot see into compiled numba kernels, thus the kernels run as Python here.
      # This run takes more than 30 minutes, thus it is not a check of each pull request.
      - name: Run the tests with coverage
        env:
          NUMBA_DISABLE_JIT: "1"
        run: uv run pytest --cov --cov-report=term-missing
