name: Coverage

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install the dependencies
        run: uv sync --locked

      # Coverage cannot see into compiled numba kernels, thus the kernels run as Python here.
      # Then the coverage tracer stops the pool threads on its data lock, thus the plugin
      # tools/coverage/serial_pool.py runs the pool in the caller thread.
      # This run takes more than 30 minutes, thus it is not a check of each pull request.
      - name: Run the tests with coverage
        env:
          PYTHONPATH: tools/coverage
          NUMBA_DISABLE_JIT: "1"
        run: uv run pytest -p serial_pool --cov --cov-report=term-missing
