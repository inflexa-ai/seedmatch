name: Wheels

# A push of a tag v* also publishes the wheels and the sdist to PyPI.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: wheel (linux, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The action reads the Rust version from rust-toolchain.toml.
      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --locked --out dist

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      # pyproject.toml puts only tests/ on the path, thus the tests import the installed wheel.
      - name: Test the wheel
        run: |
          uv venv --python 3.12
          uv pip install dist/*.whl --group dev
          .venv/bin/python -m pytest tests/search tests/test_package.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-linux-${{ matrix.target }}
          path: dist/

  macos:
    name: wheel (macos, aarch64)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The action reads the Rust version from rust-toolchain.toml.
      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: aarch64
          args: --release --locked --out dist

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      # pyproject.toml puts only tests/ on the path, thus the tests import the installed wheel.
      - name: Test the wheel
        run: |
          uv venv --python 3.12
          uv pip install dist/*.whl --group dev
          .venv/bin/python -m pytest tests/search tests/test_package.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-macos-aarch64
          path: dist/

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the Rust toolchain
        run: rustup toolchain install

      # A file that the build needs and that the sdist does not hold makes this build fail.
      - name: Build a wheel from the sdist
        run: uv build --wheel dist/*.tar.gz --out-dir sdist-wheel

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The PyPI project trusts this job in this environment, thus the upload needs no token.
    environment:
      name: pypi
      url: https://pypi.org/p/seedmatch
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # PyPI keeps each version for all time, thus a file with a different version must not go up.
      - name: Compare the version of each file with the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          for file in dist/*; do
            case "${file#dist/}" in
              "seedmatch-$version.tar.gz" | "seedmatch-$version-"*.whl) ;;
              *) echo "::error::$file does not have the version $version of the tag"; exit 1 ;;
            esac
          done

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
