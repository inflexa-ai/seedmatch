name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install the Rust toolchain
        run: rustup toolchain install

      - name: Install the dependencies
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

      - name: Mypy
        run: uv run mypy

      - name: Rustfmt
        run: cargo fmt --manifest-path rust/Cargo.toml --check

      # The feature `python` builds PyO3, which needs the interpreter of the environment.
      - name: Clippy
        env:
          PYO3_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: cargo clippy --manifest-path rust/Cargo.toml --locked --all-targets --all-features -- -D warnings
