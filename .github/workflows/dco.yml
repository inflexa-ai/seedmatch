name: DCO

# Each commit of a pull request must have a `Signed-off-by:` trailer that matches its author
# (CONTRIBUTING.md). Dependabot commits cannot have the trailer, thus the bot is on the allowlist.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    name: dco
    runs-on: ubuntu-latest
    steps:
      - uses: KineticCafe/actions-dco@5f160e3ee086af8fc0fb567b8add0937d074123e # v3.2.0
        with:
          config: |
            [bot]
            policy = "allowlist"
            allow = ["dependabot[bot]"]
