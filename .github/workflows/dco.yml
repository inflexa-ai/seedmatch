name: DCO

# Each commit of a pull request must have a `Signed-off-by:` trailer that matches its author
# (CONTRIBUTING.md). Dependabot commits cannot have the trailer, thus the bot is on the allowlist.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    name: dco
    runs-on: ubuntu-latest
    steps:
      - uses: KineticCafe/actions-dco@e9627100b7f566546e67cde54bfa7d3790ab649b # v4.0.0
        with:
          config: |
            [bot]
            policy = "allowlist"
            allow = ["dependabot[bot]"]
