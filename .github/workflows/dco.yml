name: DCO

# Each commit of a pull request must have a `Signed-off-by:` trailer that matches its author
# (CONTRIBUTING.md). Dependabot commits cannot have the trailer, thus the bot is on the allowlist.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    name: dco
    runs-on: ubuntu-latest
    steps:
      - uses: KineticCafe/actions-dco@a52e56727ec21d6cdba26513826e1ae4a752d2fc # v3.2.1
        with:
          config: |
            [bot]
            policy = "allowlist"
            allow = ["dependabot[bot]"]
