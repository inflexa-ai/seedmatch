version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # `constraint-dependencies` in pyproject.toml pins these packages to the versions of the
    # inflexa sandbox. A bump of these packages starts with a bump of the sandbox.
    ignore:
      - dependency-name: "numpy"
      - dependency-name: "pandas"
      - dependency-name: "numba"
      - dependency-name: "llvmlite"
      - dependency-name: "scipy"
      - dependency-name: "pandas-stubs"
      - dependency-name: "matplotlib"
      - dependency-name: "contourpy"
      - dependency-name: "cycler"
      - dependency-name: "fonttools"
      - dependency-name: "kiwisolver"
      - dependency-name: "pillow"
      - dependency-name: "pyparsing"
      - dependency-name: "python-dateutil"
      - dependency-name: "six"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
